<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kolam — a small universe</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #e8f4ff; font: 16px/1.65 system-ui, sans-serif; }
    article { max-width: 700px; margin: auto; padding: 5rem 1.5rem 8rem; }
    a, button { color: inherit; }
    button { background: #14202e; padding: .8rem 1.2rem; border: 1px solid #60758b; border-radius: 5px; cursor: pointer; font: inherit; }
    a:focus-visible, button:focus-visible { outline: 2px solid #89cbd1; outline-offset: 5px; }
    .destination { min-height: 100svh; animation: arrive 1.3s ease both; }
    @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .destination { animation: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
